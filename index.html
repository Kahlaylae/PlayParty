    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/playpartylogo-500.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta property="og:title" content="Play Party Online | Free Indie Games">
    <meta property="og:description" content="Quality indie games for solo and multiplayer fun. Play free arcade games directly in your browser!">

    <meta property="og:image" content="https://playparty.online/assets/playpartylogo-500.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Play Party Online | Free Indie Games">
    <meta name="twitter:description" content="Quality indie games for solo and multiplayer fun. Play free arcade games directly in your browser!">
    <meta name="twitter:image" content="https://playparty.online/assets/playpartylogo-500.png">
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-3098807263908139">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3098807263908139" crossorigin="anonymous"></script>
    
    <!-- Stylesheet -->
    <link href="assets/design.css" rel="stylesheet">
</head>

<body>
    <!-- Universal Navigation -->
    <nav>
        <a href="index.html" class="logo">
            <img src="assets/favicon.png" alt="Play Party">
            <span>Play Party</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="active">Games</a>
            <a href="emojihunter/index.html" class="play-btn">▶ Play</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main>
        <div class="landing-container">
            <!-- Hero -->
            <section class="hero">
                <img src="assets/playpartylogo-500.png" alt="Play Party Logo" class="hero-logo">
                <h1>Play Party Online</h1>
                <p>Free arcade games. No downloads. Just play!</p>
            </section>
            
            <!-- Ad Slot - Top -->
            <section class="ad-container">
                <div class="ad-slot">
                    <!-- testad -->
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3098807263908139"
                         data-ad-slot="5178682122"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </section>
            
            <!-- Games Grid - Rendered from games.json -->
            <section class="games-grid" id="games-grid">
                <!-- Games loaded dynamically -->
            </section>
            
            <!-- Ad Slot - Bottom -->
            <section class="ad-container">
                <div class="ad-slot">
                    <!-- testad -->
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3098807263908139"
                         data-ad-slot="5178682122"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                </div>
            </section>
            
            <!-- Footer -->
            <footer>
                <p>© 2026 Play Party Online</p>
                <p><a href="mailto:contact@playparty.online">Contact</a></p>
            </footer>
        </div>
    </main>
    
    <!-- Games Grid Renderer -->
    <script>
        (async function loadGames() {
            try {
                const resp = await fetch('assets/games.json');
                const data = await resp.json();
                const grid = document.getElementById('games-grid');
                
                grid.innerHTML = data.games.map(game => {
                    const isLive = game.status === 'live';
                    const tag = isLive ? 'a' : 'div';
                    const href = isLive ? `href="${game.path}"` : '';
                    const statusClass = isLive ? '' : 'coming-soon';
                    const badge = isLive ? '▶ Play Now' : 'Coming Soon';
                    
                    return `
                        <${tag} ${href} class="game-card ${statusClass}">
                            <span class="emoji-icon">${game.emoji}</span>
                            <h3>${game.title}</h3>
                            <p>${game.description}</p>
                            <span class="play-badge">${badge}</span>
                        </${tag}>
                    `;
                }).join('');
            } catch (e) {
                console.error('Failed to load games:', e);
            }
        })();
    </script>
</body>
</html>
