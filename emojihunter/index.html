<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Emoji Hunter | Play Party Online</title>
    
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <meta name="google-adsense-account" content="ca-pub-3098807263908139">
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3098807263908139" crossorigin="anonymous"></script>
    
    <!-- Lottie Web for animated sprites -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    
    <!-- Shared design system -->
    <link href="../assets/design.css" rel="stylesheet">
    
    <style>
        /* Game-specific styles */
        :root {
            --panel: rgba(13,17,23,0.85);
            --accent: #4CAF50;
        }

        /* Hide cursor in game area */
        .game-window { cursor: none; }

        /* Canvas fills container exactly */
        #dragonCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            z-index: 10;
            background: var(--color-bg);
        }

        /* UI Controls */
        .top-control {
            padding: 8px 12px;
            min-width: 44px;
            min-height: 36px;
            background: var(--panel);
            color: #fff;
            border-radius: 8px;
            border: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 16px;
            z-index: 80;
        }

        #score {
            position: absolute;
            top: 16px;
            left: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
            z-index: 20;
            background: var(--panel);
            border-radius: 10px;
            padding: 6px 12px;
        }

        #shoot-instructions {
            position: absolute;
            top: 64px;
            left: 8px;
            font-size: 0.95rem;
            color: #fff;
            background: rgba(13,17,23,0.7);
            border-radius: 8px;
            padding: 6px 12px;
            z-index: 19;
        }

        /* Splash overlays */
        #splashScreen {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            background: rgba(0,0,0,0.7);
        }

        .splash-inner {
            width: 100%;
            max-width: 600px;
            padding: 24px;
            text-align: center;
        }

        .splash-inner h1 { font-size: 2.5rem; margin: 0 0 8px; }
        .splash-inner h2 { font-size: 1.5rem; margin: 0; }
        .splash-inner p { font-size: 1rem; margin-top: 10px; }
        .splash-inner .restart-prompt { font-size: 0.9rem; margin-top: 20px; opacity: 0.8; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }

        /* Leaderboard */
        #leaderboard {
            position: absolute;
            right: 16px;
            top: 70px;
            z-index: 25;
            background: rgba(13,17,23,0.95);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            min-width: 240px;
            max-width: 300px;
        }

        #leaderboard.centered {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%);
            z-index: 70 !important;
            width: 90% !important;
            max-width: 400px !important;
        }

        #leaderboard .close-btn { position: absolute; top: 8px; right: 8px; background: transparent; border: 0; color: #fff; cursor: pointer; padding: 4px; }
        #leaderboard #leaderboard-list { max-height: 200px; overflow: auto; margin-bottom: 8px; font-size: 0.9rem; }
        #leaderboard input { padding: 6px; border-radius: 6px; border: 0; width: 100%; }
        #leaderboard .btn-row { display: flex; gap: 6px; margin-top: 8px; }
        #leaderboard .btn-row .btn { padding: 8px; border-radius: 6px; border: 0; cursor: pointer; }
        #leaderboard .btn-row .submit { flex: 1; background: #4CAF50; color: #000; }
        #leaderboard .btn-row .clear { background: #ff5252; color: #fff; }
        #leaderboard .btn-row .btn[disabled] { background: rgba(255,255,255,0.1) !important; color: rgba(255,255,255,0.5) !important; cursor: not-allowed; }

        /* Control positioning */
        #pause-toggle { right: 16px; }
        #leaderboard-toggle { right: 64px; }
        #audio-toggle { right: 112px; }
        #fullscreen-toggle { right: 160px; }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .splash-inner h1 { font-size: 1.5rem; }
            .splash-inner h2 { font-size: 1.1rem; }
            .top-control { padding: 6px 8px; min-width: 36px; min-height: 32px; top: 8px; }
            #score { top: 8px; left: 4px; font-size: 1.1rem; padding: 4px 10px; }
            #shoot-instructions { top: 48px; left: 4px; font-size: 0.85rem; padding: 4px 8px; }
            #pause-toggle { right: 8px; }
            #leaderboard-toggle { right: 52px; }
            #audio-toggle { right: 96px; }
            #fullscreen-toggle { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">
            <img src="../assets/favicon.png" alt="Play Party">
            <span>Play Party</span>
        </a>
        <div class="nav-links">
            <a href="../index.html">Games</a>
        </div>
    </nav>

    <main>
        <!-- Ad Slot - Above Game -->
        <section class="ad-container" style="padding: 8px; text-align: center;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3098807263908139"
                 data-ad-slot="5178682122"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </section>
        
        <div class="game-window" id="game-container">
            <!-- Game canvas and UI injected by emojihunter.js -->
        </div>
    </main>

    <script type="module" src="script/emojihunter.js"></script>
</body>
</html>
